[tool.mypy]
strict = true
python_version = "3.11"
explicit_package_bases = true
mypy_path = "src"

# Exclude tests/ dir from strict checking
[[tool.mypy.overrides]]
module = [
    "akshare",
    "requests",
    "dotenv",
    "pydantic",
    "pandas",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
