version: "3.8"

services:
  watchtower:
    build: .
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    env_file:
      - .env
    command: python src/main.py

  dashboard:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
    env_file:
      - .env
    command: python src/dashboard_server.py
